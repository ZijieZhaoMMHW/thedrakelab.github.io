# On every pull request: build the site to catch typos in front matter,
# broken internal links, and other errors before they reach the live site.
# The built site is attached to the run as a downloadable "site-preview" artifact.
name: Check pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check internal links and images
        run: node scripts/check-links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 7
