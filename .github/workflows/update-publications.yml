# Weekly: pull new works from ORCID and open a pull request if anything changed.
name: Update publications

on:
  schedule:
    - cron: '17 14 * * 1'   # Mondays, 14:17 UTC (6:17 / 7:17 am Pacific)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: update
        run: |
          npm run update-publications | tee update.log
          {
            echo 'log<<EOF'
            grep -E '^\s+[+!]' update.log || echo '(metadata changes only)'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-publications
          delete-branch: true
          add-paths: data/publications.json
          commit-message: Update publications from ORCID
          title: Update publications from ORCID
          body: |
            Automated weekly update from ORCID.

            ```
            ${{ steps.update.outputs.log }}
            ```

            Check the list below before merging. To hide an item, add its DOI to `data/publications-exclude.txt`.
            If a preprint and its published version both appear, combine them on ORCID (then re-run this workflow).
